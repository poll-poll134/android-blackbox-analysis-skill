name: Bug report
description: Report a reproducible problem without private Android evidence.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not attach APKs, screenshots, UI dumps, device identifiers, credentials, or vulnerability details. Use private vulnerability reporting for security issues.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.1 or commit SHA
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Host platform
      options: [macOS, Linux, Windows with WSL2, Other]
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Sanitized reproduction
      description: Include the command and output after removing private identifiers.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed credentials, device addresses, serials, private package names, screenshots, APKs, and UI dumps.
          required: true
        - label: This is not a vulnerability disclosure.
          required: true
