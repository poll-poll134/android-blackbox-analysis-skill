name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Verify tag and release notes
        run: |
          test "${GITHUB_REF_NAME#v}" = "$(cat VERSION)"
          test -s "docs/releases/${GITHUB_REF_NAME}.md"
      - name: Run release validation
        run: |
          ./scripts/smoke_test.sh
          ./tests/security_negative_test.sh
          node ./scripts/validate_skill.mjs .
          node ./scripts/validate_example.mjs ./examples/sanitized-complete-example
          node ./scripts/redact_check.mjs .
      - name: Build deterministic release assets
        run: python3 ./scripts/package_release.py
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            ./dist/android-blackbox-analysis-skill-${GITHUB_REF_NAME}.zip \
            ./dist/android-blackbox-analysis-skill-${GITHUB_REF_NAME}.zip.sha256 \
            --verify-tag \
            --title "$GITHUB_REF_NAME — Security and Distribution Hardening" \
            --notes-file "docs/releases/${GITHUB_REF_NAME}.md"
